[package]
name = "kadr"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "kadr"
path = "src/main.rs"

[[bin]]
name = "KadrSetup"
path = "src/installer.rs"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rfd = "0.15"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
